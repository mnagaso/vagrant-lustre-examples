# SLURM configuration for Lustre cluster
ClusterName=lustre_cluster
SlurmctldHost=login(192.168.10.30)

# Authentication
AuthType=auth/munge
CryptoType=crypto/munge
MpiDefault=none

# Communication settings
SlurmctldPort=6817
SlurmdPort=6818
ReturnToService=1

# Process tracking
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none

# Scheduling
SchedulerType=sched/backfill
SelectType=select/linear
SchedulerParameters=bf_interval=5,bf_resolution=1,bf_window=30


# Logging
SlurmctldDebug=info
SlurmdDebug=info
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log

# Job completion handling
JobCompType=jobcomp/none
AccountingStorageType=accounting_storage/none

# Paths and directories
SlurmdSpoolDir=/var/spool/slurmd
StateSaveLocation=/var/spool/slurmctld/state
SlurmctldPidFile=/var/run/slurm/slurmctld.pid
SlurmdPidFile=/var/run/slurm/slurmd.pid

# Users
SlurmUser=root
SlurmdUser=root

# Node configuration - IMPORTANT to match actual hardware
# Update these values based on your actual hardware
# Memory values adjusted to match actual available memory from slurmd reports
NodeName=mxs CPUs=4 Boards=1 SocketsPerBoard=1 CoresPerSocket=4 ThreadsPerCore=1 RealMemory=1700 State=UNKNOWN
NodeName=oss CPUs=4 Boards=1 SocketsPerBoard=1 CoresPerSocket=4 ThreadsPerCore=1 RealMemory=1700 State=UNKNOWN
#NodeName=login CPUs=4 Boards=1 SocketsPerBoard=1 CoresPerSocket=4 ThreadsPerCore=1 RealMemory=1700 State=UNKNOWN
NodeName=compute1 CPUs=4 Boards=1 SocketsPerBoard=1 CoresPerSocket=4 ThreadsPerCore=1 RealMemory=3665 State=UNKNOWN

# Partition definitions - Only include compute1 in the compute partition
PartitionName=compute Nodes=compute1 Default=YES MaxTime=INFINITE State=UP
PartitionName=storage Nodes=mxs,oss Default=NO MaxTime=INFINITE State=UP AllowGroups=root