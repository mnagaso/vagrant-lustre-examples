#      PYTHONUNBUFFERED: 1
#      TERM: vt100
#      SD_WEBUI_VARIANT: "default"

  comfyui:
    build:
      context: ./comfyui_fs
      dockerfile: Dockerfile
      args:
        COMFYUI_ARCH: ${COMFYUI_ARCH:-cpu}
        COMFYUI_VERS: ${COMFYUI_VERS:-v0.3.14}
    networks:
      genai-private-net: {}
    expose:
      - 8188
    volumes:
      - type: bind
        source: ./comfyui_fs/user
        target: /app/comfyui/user
        read_only: false
      - type: bind
        source: ./comfyui_fs/extra_model_paths.yaml
        target: /app/comfyui/emp.yaml
        read_only: true
      - type: bind
        source: ./models/comfyui
        target: /models
        read_only: true
    restart: no
    pull_policy: never
    environment:
      #from https://github.com/comfyanonymous/ComfyUI/blob/v0.3.14/comfy/cli_args.py
      COMMANDLINE_ARGS: "--cpu --cpu-vae"
    deploy:
      mode: replicated
      replicas: ${COMFYUI_REPLICAS:-1}
      endpoint_mode: vip
      resources:
        limits:
          cpus: ${COMFYUI_CPU_LIMIT:-4}
          memory: ${COMFYUI_MEM_LIMIT:-4}G
          #pids: 1
        reservations:
          cpus: "1"
          memory: 1G
          #devices:
          #  - capabilities: ["nvidia-compute"]
          #    driver: nvidia
          #    count: 0

  comfyui-dl:
    build:
      context: ./comfyui_fs
      dockerfile: Dockerfile
      args:
        COMFYUI_ARCH: ${COMFYUI_ARCH:-cpu}
        COMFYUI_VERS: ${COMFYUI_VERS:-v0.3.14}
    networks:
      genai-public-net: {}
    profiles: [dl]
    entrypoint: bash /app/comfyui/dl.sh
    volumes:
      - type: bind
        source: ./comfyui_fs
        target: /app/comfyui/user
        read_only: false
      - type: bind
        source: ./comfyui_fs/download_models.sh
        target: /app/comfyui/dl.sh
        read_only: true
      - type: bind
        source: ./models/comfyui
        target: /models
        read_only: false
    cpu_count: ${DOWNLOAD_CPU_LIMIT:-2}
    mem_limit: ${DOWNLOAD_MEM_LIMIT:-2}g
    restart: no
    pull_policy: never

  openedaispeech:
    image: ghcr.io/matatonic/openedai-speech:${OPENEDAISPEECH_DOCKER_TAG:-latest}
    networks:
      genai-private-net: {}
    expose:
      - 8000
    volumes:
      - type: bind
        source: ./openedaispeech_fs
        target: /app/config
        read_only: false
      - type: bind
        source: ./models/openedaispeech
        target: /app/voices
        read_only: true
    restart: unless-stopped
    pull_policy: always
    environment:
      TTS_HOME: voices
      HF_HOME: voices
      #PRELOAD_MODEL: xtts
      #EXTRA_ARGS: '--log-level DEBUG --unload-timer 300'
      #USE_ROCM: 1
    deploy:
      mode: replicated
      replicas: ${OPENEDAISPEECH_REPLICAS:-1}
      endpoint_mode: vip
      resources:
        limits:
          cpus: ${OPENEDAISPEECH_CPU_LIMIT:-4}
          memory: ${OPENEDAISPEECH_MEM_LIMIT:-4}G
          #pids: 1
        reservations:
          cpus: "1"
          memory: 1G

  openedaispeech-dl:
    image: ghcr.io/matatonic/openedai-speech:${OPENEDAISPEECH_DOCKER_TAG:-latest}
    networks:
      genai-public-net: {}
    profiles: [dl]
    entrypoint: bash /app/dl.sh ${OPENEDAISPEECH_DEFAULT_VOICE:-en_GB-alba-medium}
    volumes:
      - type: bind
        source: ./openedaispeech_fs/download_models.sh
        target: /app/dl.sh
        read_only: true
      - type: bind
        source: ./openedaispeech_fs
        target: /app/config
        read_only: false
      - type: bind
        source: ./models/openedaispeech
        target: /app/voices
        read_only: false
    cpu_count: ${DOWNLOAD_CPU_LIMIT:-2}
    mem_limit: ${DOWNLOAD_MEM_LIMIT:-2}g
    restart: no
    pull_policy: missing
    environment:
      TTS_HOME: voices
      HF_HOME: voices

networks:
  genai-public-net:
    external: true
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
  genai-private-net:
    internal: true
    driver: bridge
    ipam:
      config:
        - subnet: 172.69.0.0/23
          gateway: 172.69.0.1
